<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Excuse Generator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="site-header">
    <div class="header-content">
      <h1>🎭 Excuse Generator</h1>
      <p>Tell us what happened. We'll come up with an excuse.</p>
    </div>
  </header>

  <main class="container">
    <section class="tool-card">

      <textarea
        id="excuseInput"
        placeholder="What happened?"
        rows="6"
      ></textarea>

      <button id="excuseButton" class="tool-button">
        Generate Excuse
      </button>

      <div id="excuseResult" class="result-area">
        <p>Your perfectly questionable excuse will appear here.</p>
      </div>

    </section>
  </main>

  <footer class="site-footer">
    <p><a href="index.html" style="color:#d1d5db;">&larr; Back to UselessSuite</a></p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
