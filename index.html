<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Excuse Generator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="container">
    <h1>🎭 Excuse Generator</h1>
    <p class="subtitle">Tell us what happened. We'll come up with an excuse.</p>

    <div class="form-group">
      <textarea id="userInput" placeholder="What happened?"></textarea>
    </div>

    <button id="generateBtn">Generate Excuse</button>

    <div id="excuseOutput" class="excuse-output"></div>
  </div>
<section class="tool-card">
    <h2>🤖 Text Dehumaniser</h2>
    <p>Give us some human writing. We'll remove the humanity.</p>

```
<textarea
    id="dehumaniserInput"
    placeholder="Enter your text..."
    rows="8"
></textarea>

<button id="dehumaniseButton">
    Dehumanise
</button>

<div id="dehumaniserResult" class="result-area">
    <p>Your dehumanised text will appear here.</p>
</div>
```

</section>


  <script src="script.js"></script>
</body>
</html>
